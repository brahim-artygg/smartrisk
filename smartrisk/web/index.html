  <title>SmartRisk — EVM Token Risk Scanner</title>
  <meta name="description" content="Scan EVM token contracts for smart-contract, trading, liquidity, holder, and on-chain risk signals before you interact.">
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/footer.css">
</head>
<body>
  <main class="page-shell">
    <section class="scanner" aria-label="SmartRisk token scanner">
      <div class="top-nav"><a id="account-link" class="account-link" href="/auth?mode=login">Login</a></div>
      <a class="brand" href="/" aria-label="SmartRisk home"><img class="brand-logo" src="/assets/logo.png" alt="" aria-hidden="true"><span>SmartRisk</span></a>

      <form id="scan-form" class="scan-form" novalidate>
        <div class="scan-box" id="scan-box">
          <label class="sr-only" for="token">Contract address</label>
          <input
            id="token"
            name="token"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="0x… contract address"
            aria-describedby="form-message"
            required
          >
          <button id="scan-button" type="submit">
            <span class="button-label">Scan</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </div>
        <div id="form-message" class="form-message" role="status" aria-live="polite"></div>
      </form>

      <div id="scan-status" class="scan-status" hidden>
        <span class="status-dot"></span>
        <span id="status-text">Submitting scan…</span>
      </div>

    </section>
  </main>
  <footer class="site-footer" aria-label="SmartRisk footer">

    <span>© Copyright SmartRisk 2026</span>
  </div>
</footer>
  <script src="/assets/app.js" defer></script>
</body>
